name: Setup
description: Install pnpm, Node, and the workspace dependencies.

runs:
  using: composite
  steps:
    # Version comes from the root package.json "packageManager" field.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    # The root `prepare` script runs `effect-tsgo patch`, which supplies the
    # @effect/language-service plugin. It re-runs on every install by design.
    - run: pnpm install --frozen-lockfile
      shell: bash
